[package]
name = "increart-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
eframe = "0.37"
egui-phosphor = { version = "0.14", features = ["regular", "fill"] }
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
increart-core = { version = "0.1.0", path = "../increart-core" }
increart-gui-core = { version = "0.1.0", path = "../increart-gui-core" }
similar = "2"

[[bin]]
name = "increart"
path = "src/main.rs"
