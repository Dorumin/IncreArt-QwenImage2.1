[package]
name = "increart-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# AVIF import (links the system libdav1d) and export (pure Rust).
avif = ["image/avif-native", "image/avif"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
blake3 = "1.8.7"
crc32fast = "1.5.3"
getrandom = "0.3.4"
libc = "0.2.191"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
moxcms = "0.8.1"
pathdiff = "0.2.3"
rsn = "0.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
trash = "5.2.9"
ureq = { version = "3.5.0", features = ["json"] }
webp = { version = "0.3.1", default-features = false }
tar = "0.4.46"
flate2 = "1.1.10"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"
